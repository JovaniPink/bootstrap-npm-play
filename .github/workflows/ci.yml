name: CI

on: [pull_request]

env:
  CI: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: "${{ matrix.node }}"

      - name: Install npm dependencies
        run: npm ci

      - name: Test
        run: npm test
